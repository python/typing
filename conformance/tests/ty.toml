[environment]
python-version = "3.12"

[rules]
deprecated = "error"
invalid-legacy-positional-parameter = "error"
redundant-final-classvar = "error"
assert-type-unspellable-subtype = "ignore"
invalid-enum-member-annotation = "error"
mismatched-newtype-name = "error"
mismatched-typevar-name = "error"
mismatched-typevartuple-name = "error"
mismatched-type-alias-name = "error"
mismatched-paramspec-name = "error"
mismatched-typeddict-name = "error"
single-overload = "error"
suspicious-type-is-narrowing = "error"
invalid-named-tuple-override = "error"
ambiguous-protocol-member = "error"
